name: Helper tests

# Guards the CI helpers (snap version/channel math; the retry-fetch remote-build
# wrapper). Runs on every PR (seconds) so `test` can be a required status check —
# a path-filtered workflow that never starts would leave the check "expected"
# forever and deadlock auto-merge on PRs that don't touch its paths.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shellcheck the CI helpers + tests
        run: shellcheck .github/scripts/*.sh

      - name: Run helper unit tests
        run: |
          for t in .github/scripts/*.test.sh; do
            echo "== $t"
            bash "$t" || exit 1
          done
