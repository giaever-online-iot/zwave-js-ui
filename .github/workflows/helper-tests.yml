name: Helper tests

# Guards the CI helpers (snap version/channel math; the retry-fetch remote-build
# wrapper; store track creation + credential health). The last step also reports
# the gateway credential's health as annotations only — it never fails the job.
# Runs on every PR (seconds) so `test` can be a required status check — a
# path-filtered workflow that never starts would leave the check "expected"
# forever and deadlock auto-merge on PRs that don't touch its paths.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shellcheck the CI helpers + tests
        run: shellcheck .github/scripts/*.sh

      - name: Run helper unit tests
        run: |
          for t in .github/scripts/*.test.sh; do
            echo "== $t"
            bash "$t" || exit 1
          done

      - name: Install store client
        run: |
          python3 -m venv "$RUNNER_TEMP/store-venv"
          .github/scripts/retry.sh 3 15 -- "$RUNNER_TEMP/store-venv/bin/pip" install -q --require-hashes -r .github/scripts/requirements-store.txt \
            || { echo "::error::could not install the store client (pip, requirements-store.txt)."; exit 1; }

      - name: Run store-client helper unit tests
        run: |
          for t in .github/scripts/*.test.py; do
            echo "== $t"
            "$RUNNER_TEMP/store-venv/bin/python" "$t" || exit 1
          done

      - name: Store gateway credential health (annotations only)
        env:
          SNAPCRAFT_GATEWAY_CREDENTIALS: ${{ secrets.SNAPCRAFT_GATEWAY_CREDENTIALS }}
        run: |
          "$RUNNER_TEMP/store-venv/bin/python" .github/scripts/snap-create-track.py --check
